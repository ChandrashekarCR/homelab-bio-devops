name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      # Fix 1: Enable globstar so ** matches nested folders, and check syntax safely
      - name: Check shell syntax
        run: |
          shopt -s globstar
          bash -n scripts/**/*.sh tests/**/*.sh

      # Fix 2: Run shellcheck recursively through all nested subdirectories
      - name: Run shellcheck
        run: |
          shopt -s globstar
          shellcheck scripts/**/*.sh tests/**/*.sh

