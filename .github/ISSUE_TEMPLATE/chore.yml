name: 🔧 Chore / maintenance
description: Upkeep with no new behaviour (updates, cleanup, tooling, CI).
title: "chore: "
labels: ["type: chore"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now?
      description: What happens if this waits a month?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when…
      value: |
        - [ ]
    validations:
      required: true
