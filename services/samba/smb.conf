# Managed by homelab-bio-devops.
# Keep passwords out of this file. Samba passwords belong in its local passdb.

[global]
   workgroup = WORKGROUP
   server string = Homelab Samba Server
   netbios name = HOMELAB
   server role = standalone server
   security = user
   map to guest = never
   obey pam restrictions = yes
   disable spoolss = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   server min protocol = SMB2
   unix extensions = yes
   log file = /var/log/samba/%m.log
   max log size = 1000

[family]
   comment = Family shared storage
   path = /srv/samba/family
   browseable = yes
   read only = no
   valid users = @family
   force group = family
   create mask = 0660
   directory mask = 0770
   inherit permissions = yes
   inherit acls = yes
